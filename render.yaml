# Render Blueprint for Alerta.
#
# This deploys Alerta as a static site (Vite build output, no server
# process needed — it's a pure client-side SPA talking to Supabase).
#
# To use it:
#   1. Push this file to your repo (already done if you're reading it here).
#   2. In the Render dashboard: New -> Blueprint -> select this repo.
#      Render will detect this file and create the service below.
#   3. Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY on the service
#      (see "envVars" below — sync: false means Render will prompt you
#      for the value rather than storing a default).
#
# See README.md for full setup (Supabase project + migrations) and
# supabase/README.md for schema/RLS details.

services:
  - type: web
    name: alerta
    runtime: static
    repo: https://github.com/Siphiwe-Khumalo/Alertia
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
    routes:
      # Client-side routing (React Router) — any path that isn't a real
      # static asset should fall through to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
